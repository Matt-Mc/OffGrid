name: Build desktop release

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      # Only execute code already merged into main, never the PR's head branch.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reserve release version and immutable source tag
        id: release
        run: node scripts/prepare-release.cjs

  build:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Validate architecture and release version
        env:
          RELEASE_REF: ${{ needs.prepare.outputs.tag != '' && format('refs/tags/{0}', needs.prepare.outputs.tag) || github.ref }}
        run: |
          node -e 'const p=require("./package.json"); if(!/^\d+\.\d+\.\d+$/.test(p.version)) throw new Error("Stable version required"); if(process.arch!=="arm64") throw new Error("ARM64 runner required"); if(process.env.RELEASE_REF.startsWith("refs/tags/") && process.env.RELEASE_REF!=="refs/tags/v"+p.version) throw new Error("Tag must match package.json version");'
      - name: Install build dependencies
        run: |
          npm ci
          brew install mpv
      - name: Test backend and player behavior
        run: npm test
      - name: Bundle mpv and its exact corresponding sources
        run: |
          npm run bundle:mpv
          npm run bundle:mpv-sources
      - name: Verify portable decoding and player controls
        run: node scripts/verify-bundled-mpv.cjs --headless
      - name: Build DMG
        env:
          # This job builds the verified merged commit from prepare. Electron-builder
          # otherwise skips our ad hoc signer because the event retains PR metadata.
          CSC_FOR_PULL_REQUEST: 'true'
        run: npm run dist
      - name: Verify packaged app
        run: |
          codesign --verify --deep --strict release/mac-arm64/Offgrid.app
          node scripts/verify-bundled-mpv.cjs release/mac-arm64/Offgrid.app/Contents/Resources/mpv --headless
          hdiutil verify release/Offgrid-*-arm64.dmg
      - name: Prepare release assets and checksums
        run: node scripts/release-assets.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offgrid-macos-arm64
          path: release/publish/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  windows:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify:win
      - run: npm run dist:win
      - name: Verify packaged Windows server UI
        run: |
          $env:OFFGRID_SMOKE_APP = Join-Path $PWD 'release/win-unpacked/Offgrid.exe'
          node scripts/smoke-plex-ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-jellyfin-ui.cjs
      - run: node scripts/release-windows-assets.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offgrid-windows-x64
          path: release/publish-windows/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: offgrid-macos-arm64
          path: assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: offgrid-windows-x64
          path: assets
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        working-directory: assets
        run: |
          sha256sum --check SHA256SUMS
          sha256sum --check SHA256SUMS-windows
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > existing-release.txt; then
            if [ "$(cat existing-release.txt)" != true ]; then
              echo 'This version is already published; keeping its existing assets.'
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "Offgrid $RELEASE_TAG" --notes-file RELEASE-NOTES.md
          fi
          gh release upload "$RELEASE_TAG" ./*.dmg ./*.exe ./*-sources-*.tar.gz ./SHA256SUMS ./SHA256SUMS-windows ./WINDOWS-RELEASE-NOTES.md ./mpv-runtime-manifest.json ./RELEASE-NOTES.md --clobber
          cat RELEASE-NOTES.md WINDOWS-RELEASE-NOTES.md > combined-notes.md
          gh release edit "$RELEASE_TAG" --notes-file combined-notes.md
          release_id=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq .id)
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" -F draft=false -f make_latest=legacy > /dev/null
